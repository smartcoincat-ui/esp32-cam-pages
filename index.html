<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32-CAM Viewer</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:920px;margin:24px auto;padding:0 16px;background:#0f172a;color:#e2e8f0}
    .card{background:#111827;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:16px}
    input{width:100%;padding:10px;border-radius:10px;border:1px solid #475569;background:#0b1220;color:#e2e8f0}
    button{padding:10px 14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    img,video{max-width:100%;border-radius:12px;border:1px solid #475569;background:#000}
    small{color:#94a3b8}
  </style>
</head>
<body>
  <h1>ESP32-CAM Viewer</h1>
  <div class="card">
    <label>Базовый URL камеры (пример: http://192.168.0.102)</label>
    <input id="base" placeholder="http://192.168.0.102" />
    <div class="row" style="margin-top:10px">
      <button id="save">Сохранить</button>
      <button id="openStream">Открыть поток</button>
      <button id="snap">Сделать снимок</button>
    </div>
    <p><small>Для ESP32-CAM обычно: поток <code>:81/stream</code>, кадр <code>/capture</code>.</small></p>
  </div>

  <div class="card">
    <h3>Поток</h3>
    <img id="stream" alt="stream" />
  </div>

  <div class="card">
    <h3>Последний снимок</h3>
    <img id="shot" alt="snapshot" />
  </div>

<script>
const baseInput = document.getElementById('base');
const streamEl = document.getElementById('stream');
const shotEl = document.getElementById('shot');
const key='esp32_base_url';
baseInput.value = localStorage.getItem(key) || 'http://192.168.0.102';
function base(){ return baseInput.value.replace(/\/$/, ''); }
function applyStream(){ streamEl.src = `${base()}:81/stream`; }
function snap(){ shotEl.src = `${base()}/capture?t=${Date.now()}`; }
document.getElementById('save').onclick = () => { localStorage.setItem(key, baseInput.value.trim()); alert('Сохранено'); };
document.getElementById('openStream').onclick = applyStream;
document.getElementById('snap').onclick = snap;
applyStream();
snap();
</script>
</body>
</html>
